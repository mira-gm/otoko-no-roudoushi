<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="縄文から現代まで、働く男たちの仕事と日常を描くデジタル絵本。">
  <title>男たちの労働史</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <main>
    <section class="home-hero" aria-label="男たちの労働史">
      <img src="images/roudoushi_header.jpg" alt="縄文の狩人から昭和のサラリーマンまで、時代を超えて働く男たち">
    </section>
    <section class="intro">
      <p class="intro-lead">現代の働くあなたへ。<br>過去を生きた男たちから、ささやかなエールを。</p>
      <div class="intro-copy">
        <p>縄文から現代まで。暮らしを守るため、懸命に働いた男たちがいました。</p>
        <p>厳しい仕事、理不尽な仕打ち。彼らの姿に、時代を超えた働く者の苦労を感じてください。</p>
      </div>
    </section>

    <section class="works-section" aria-labelledby="works-heading">
      <div class="section-heading">
        <p class="eyebrow">STORIES</p>
        <h1 id="works-heading">物語を読む</h1>
        <p>時代をたどりながら、働く男たちの人生をのぞいてみてください。</p>
      </div>
      <div id="works-list" class="works-grid" aria-live="polite">
        <p class="loading">作品を読み込んでいます……</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>男たちの労働史</p>
    <small>時代を越えて、働く男たちの姿をたどる。</small>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
